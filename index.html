<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelFooty</title>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .pixel-logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* PF Logosu ve Yanındaki Orijinal Yazı */
        .pixel-logo-img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0f172a 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: monospace;
        }

        .logo-text span {
            color: #22c55e;
            -webkit-text-fill-color: #22c55e;
        }

        .lang-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: #e2e8f0;
        }

        .info-text {
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #475569;
        }

        .canvas-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 250px;
            margin: 10px 0;
        }

        canvas {
            image-rendering: pixelated;
            width: 100%;
            height: auto;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        .center-restart-btn {
            position: absolute;
            background: #22c55e;
            border: none;
            color: #ffffff;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s;
        }

        .center-restart-btn:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        #submitBtn {
            background: #3b82f6;
            color: white;
        }

        #submitBtn:hover {
            background: #2563eb;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }

        .btn-row button {
            flex: 1;
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-row button:hover {
            background: #e2e8f0;
        }

        .message {
            font-weight: bold;
            margin-top: 12px;
            min-height: 24px;
            font-size: 0.95rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header-top">
            <div class="pixel-logo-container">
                <!-- PF Logosu ve Yazı Birlikte -->
                <img src="logos/pf-logo.png" alt="PixelFooty Logo" class="pixel-logo-img">
                <div class="logo-text">Pixel<span>Footy</span></div>
            </div>
            <button class="lang-btn" id="langToggle">EN 🇬🇧</button>
        </div>
        
        <div class="info-text" id="scoreDisplay">Puan: 0</div>
        <div class="info-text" id="streakDisplay">Seri: 0</div>
        <div class="info-text" id="progressDisplay">1 / 18</div>
        <div class="info-text" id="leagueDisplay">🇹🇷 Süper Lig</div>

        <div class="canvas-wrapper">
            <canvas id="pixelCanvas" width="256" height="256"></canvas>
            <button id="restartBtn" class="center-restart-btn hidden">Yeniden Başla</button>
        </div>

        <div class="info-text" id="statusDisplay">Netlik: Aşama 1/4 Ödül: 25 Puan</div>

        <div class="input-row" id="inputSection">
            <input type="text" id="guessInput" placeholder="Takım adını yazın..." autocomplete="off">
            <button id="submitBtn">Tahmin Et</button>
        </div>

        <div class="btn-row" id="actionSection">
            <button id="hintBtn">Netleştir (-5 Puan)</button>
            <button id="skipBtn">Pas Geç</button>
        </div>

        <div class="message" id="message"></div>
    </div>

<script>
    const translations = {
        tr: {
            score: "Puan: ",
            streak: "Seri: ",
            league: "🇹🇷 Süper Lig",
            placeholder: "Takım adını yazın...",
            submit: "Tahmin Et",
            hint: "Netleştir (-5 Puan)",
            skip: "Pas Geç",
            restart: "Yeniden Başla",
            correctMsg: "Tebrikler! Doğru bildin 🎉",
            wrongMsg: "Yanlış! Tekrar dene ❌",
            shortNameMsg: "Lütfen tam olarak tahmin edin! ⚠️",
            gameOver: "Tebrikler! Tüm takımları bitirdin! 🏆"
        },
        en: {
            score: "Score: ",
            streak: "Streak: ",
            league: "🇹🇷 Turkish Super League",
            placeholder: "Enter team name...",
            submit: "Guess",
            hint: "Sharpen (-5 Pts)",
            skip: "Skip",
            restart: "Restart",
            correctMsg: "Correct! Well done 🎉",
            wrongMsg: "Wrong! Try again ❌",
            shortNameMsg: "Please guess properly! ⚠️",
            gameOver: "Congrats! You finished all teams! 🏆"
        }
    };

    let currentLang = 'tr';

    const teams = [
        { name: "beşiktaş", file: "bjk.png" },
        { name: "fenerbahçe", file: "fb.png" },
        { name: "galatasaray", file: "gs.png" },
        { name: "trabzonspor", file: "ts.png" },
        { name: "başakşehir", file: "başakşehir.png" },
        { name: "samsunspor", file: "samsun.png" },
        { name: "göztepe", file: "göztepe.png" },
        { name: "konyaspor", file: "konya.png" },
        { name: "alanyaspor", file: "alanyaspor.png" },
        { name: "amed sk", file: "amedsk.png" },
        { name: "çaykur rizespor", file: "caykurrizespor.png" },
        { name: "çorum fk", file: "corumfk.png" },
        { name: "erzurumspor", file: "erzurumspor.png" },
        { name: "eyüpspor", file: "eyupspor.png" },
        { name: "gaziantep fk", file: "gaziantepfk.png" },
        { name: "gençlerbirliği", file: "genclerbirligi.png" },
        { name: "kasımpaşa", file: "kasimpaşa.png" },
        { name: "kocaeli", file: "kocaeli.png" }
    ];

    let score = 0;
    let streak = 0;
    let shuffledTeams = [];
    let currentIndex = 0;
    let currentStage = 1;
    let isAnswered = false;
    
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const guessInput = document.getElementById('guessInput');
    const submitBtn = document.getElementById('submitBtn');
    const hintBtn = document.getElementById('hintBtn');
    const skipBtn = document.getElementById('skipBtn');
    const restartBtn = document.getElementById('restartBtn');
    const message = document.getElementById('message');
    
    const scoreDisplay = document.getElementById('scoreDisplay');
    const streakDisplay = document.getElementById('streakDisplay');
    const progressDisplay = document.getElementById('progressDisplay');
    const leagueDisplay = document.getElementById('leagueDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const langToggle = document.getElementById('langToggle');

    const inputSection = document.getElementById('inputSection');
    const actionSection = document.getElementById('actionSection');

    let currentImage = new Image();

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initGame() {
        shuffledTeams = shuffleArray(teams);
        currentIndex = 0;
        score = 0;
        streak = 0;
        scoreDisplay.textContent = translations[currentLang].score + score;
        streakDisplay.textContent = translations[currentLang].streak + streak;
        loadTeam();
    }

    function loadTeam() {
        if (currentIndex >= shuffledTeams.length) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            message.textContent = translations[currentLang].gameOver;
            inputSection.classList.add('hidden');
            actionSection.classList.add('hidden');
            progressDisplay.classList.add('hidden');
            statusDisplay.textContent = "";
            restartBtn.classList.remove('hidden');
            return;
        }
        
        inputSection.classList.remove('hidden');
        actionSection.classList.remove('hidden');
        progressDisplay.classList.remove('hidden');
        restartBtn.classList.add('hidden');

        isAnswered = false;
        message.textContent = "";
        guessInput.value = "";
        currentStage = 1;
        updateStatusText();
        progressDisplay.textContent = `${currentIndex + 1} / ${shuffledTeams.length}`;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        currentImage = new Image();
        currentImage.src = `logos/${shuffledTeams[currentIndex].file}`;
        currentImage.onload = () => {
            drawImagePixelated(12);
        };
        currentImage.onerror = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#888";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            ctx.font = "16px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Logo Bulunamadı", canvas.width / 2, canvas.height / 2);
        };
    }

    function drawImagePixelated(pixelSize) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        
        if (pixelSize === 1) {
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
            return;
        }

        let w = Math.max(1, Math.floor(canvas.width / pixelSize));
        let h = Math.max(1, Math.floor(canvas.height / pixelSize));
        
        let tempCanvas = document.createElement('canvas');
        let tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = w;
        tempCanvas.height = h;
        
        tempCtx.imageSmoothingEnabled = false;
        tempCtx.drawImage(currentImage, 0, 0, w, h);
        ctx.drawImage(tempCanvas, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
    }

    function updateStatusText() {
        let earnedReward = Math.max(5, 25 - (currentStage - 1) * 5);
        if (currentLang === 'tr') {
            statusDisplay.textContent = `Netlik: Aşama ${currentStage}/4 Ödül: ${earnedReward} Puan`;
        } else {
            statusDisplay.textContent = `Clarity: Stage ${currentStage}/4 Reward: ${earnedReward} Pts`;
        }
    }

    function removeTurkishChars(str) {
        return str
            .replace(/ğ/g, 'g')
            .replace(/ü/g, 'u')
            .replace(/ş/g, 's')
            .replace(/ı/g, 'i')
            .replace(/i̇/g, 'i')
            .replace(/ö/g, 'o')
            .replace(/ç/g, 'c');
    }

    function cleanTeamName(name) {
        return name.toLowerCase()
            .trim()
            .replace(/\s+(sk|fk|spor)$/, '')
            .replace(/(sk|fk|spor)$/, '');
    }

    function checkGuess() {
        if (isAnswered) return;
        let userGuess = guessInput.value.toLowerCase().trim();
        let targetName = shuffledTeams[currentIndex].name.toLowerCase();

        const forbiddenShorts = ["gs", "fb", "bjk", "ts"];
        if (forbiddenShorts.includes(userGuess)) {
            message.textContent = translations[currentLang].shortNameMsg;
            return;
        }

        let isMatch = false;

        if (currentLang === 'tr') {
            let cleanedUser = cleanTeamName(userGuess);
            let cleanedTarget = cleanTeamName(targetName);
            if (userGuess === targetName || cleanedUser === cleanedTarget) {
                isMatch = true;
            }
        } else {
            let normalizedUser = removeTurkishChars(userGuess);
            let normalizedTarget = removeTurkishChars(targetName);
            let cleanedUser = cleanTeamName(normalizedUser);
            let cleanedTarget = cleanTeamName(normalizedTarget);
            if (normalizedUser === normalizedTarget || cleanedUser === cleanedTarget) {
                isMatch = true;
            }
        }

        let earnedPoints = Math.max(5, 25 - (currentStage - 1) * 5);

        if (isMatch) {
            isAnswered = true;
            score += earnedPoints;
            streak += 1;
            scoreDisplay.textContent = translations[currentLang].score + score;
            streakDisplay.textContent = translations[currentLang].streak + streak;
            message.textContent = translations[currentLang].correctMsg;
            
            drawImagePixelated(1);

            currentIndex++;
            setTimeout(loadTeam, 2000);
        } else {
            message.textContent = translations[currentLang].wrongMsg;
        }
    }

    submitBtn.addEventListener('click', checkGuess);
    guessInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkGuess();
    });

    hintBtn.addEventListener('click', () => {
        if (!isAnswered && currentStage < 4) {
            score = Math.max(0, score - 5);
            scoreDisplay.textContent = translations[currentLang].score + score;

            currentStage++;
            let pSize = 12 - (currentStage * 2);
            drawImagePixelated(Math.max(3, pSize));
            updateStatusText();
        }
    });

    skipBtn.addEventListener('click', () => {
        if (isAnswered) return;
        streak = 0;
        streakDisplay.textContent = translations[currentLang].streak + streak;
        currentIndex++;
        loadTeam();
    });

    restartBtn.addEventListener('click', () => {
        initGame();
    });

    langToggle.addEventListener('click', () => {
        currentLang = currentLang === 'tr' ? 'en' : 'tr';
        updateTexts();
    });

    function updateTexts() {
        let t = translations[currentLang];
        scoreDisplay.textContent = t.score + score;
        streakDisplay.textContent = t.streak + streak;
        leagueDisplay.textContent = t.league;
        guessInput.placeholder = t.placeholder;
        submitBtn.textContent = t.submit;
        hintBtn.textContent = t.hint;
        skipBtn.textContent = t.skip;
        restartBtn.textContent = t.restart;
        langToggle.textContent = currentLang === 'tr' ? "EN 🇬🇧" : "TR 🇹🇷";
        if (currentIndex < shuffledTeams.length) updateStatusText();
    }

    initGame();
</script>

</body>
</html>
