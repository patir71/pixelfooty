<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Footy - Logo Tahmin</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --correct: #22c55e;
            --wrong: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .lang-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .canvas-wrapper {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: #334155;
            color: #fff;
            flex: 1;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .correct { color: var(--correct); }
        .wrong { color: var(--wrong); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="badges">
            <span class="badge" id="leagueText">Süper Lig</span>
            <span class="badge" id="scoreText">Puan: 0</span>
        </div>
        <button class="lang-btn" id="langToggle">EN 🇬🇧</button>
    </div>

    <div class="canvas-wrapper">
        <canvas id="pixelCanvas" width="256" height="256"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="guessInput" placeholder="Takım adını yazın..." autocomplete="off">
        <button id="submitBtn">Tahmin Et</button>
    </div>

    <div class="actions">
        <button class="btn-secondary" id="hintBtn">Netleştir (-5)</button>
    </div>

    <div class="message" id="message"></div>
</div>

<script>
    // Dil Sözlüğü
    const translations = {
        tr: {
            league: "Süper Lig",
            score: "Puan: ",
            placeholder: "Takım adını yazın...",
            submit: "Tahmin Et",
            hint: "Netleştir (-5)",
            langBtn: "EN 🇬🇧",
            correctMsg: "Tebrikler! Doğru bildin 🎉",
            wrongMsg: "Yanlış! Tekrar dene ❌",
            gameOver: "Tebrikler! Tüm takımları bitirdin!"
        },
        en: {
            league: "Super Lig",
            score: "Score: ",
            placeholder: "Enter team name...",
            submit: "Guess",
            hint: "Sharpen (-5)",
            langBtn: "TR 🇹🇷",
            correctMsg: "Correct! Well done 🎉",
            wrongMsg: "Wrong! Try again ❌",
            gameOver: "Congrats! You finished all teams!"
        }
    };

    let currentLang = 'tr';

    // 9 Takımlık Liste (Başakşehir görseli başşehir.png olarak güncellendi)
    const teams = [
        { name: "galatasaray", file: "gs.png" },
        { name: "fenerbahce", file: "fb.png" },
        { name: "besiktas", file: "bjk.png" },
        { name: "trabzonspor", file: "ts.png" },
        { name: "basaksehir", file: "başşehir.png" },
        { name: "adana demirspor", file: "adana.png" },
        { name: "antalyaspor", file: "antalya.png" },
        { name: "Alanyaspor", file: "alanya.png" },
        { name: "konyaspor", file: "konya.png" }
    ];

    let score = 0;
    let currentIndex = 0;
    
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const guessInput = document.getElementById('guessInput');
    const submitBtn = document.getElementById('submitBtn');
    const hintBtn = document.getElementById('hintBtn');
    const message = document.getElementById('message');
    const leagueText = document.getElementById('leagueText');
    const scoreText = document.getElementById('scoreText');
    const langToggle = document.getElementById('langToggle');

    let currentImage = new Image();

    function loadTeam() {
        if (currentIndex >= teams.length) {
            message.textContent = translations[currentLang].gameOver;
            message.className = "message correct";
            return;
        }
        
        message.textContent = "";
        guessInput.value = "";
        
        currentImage.src = `logos/${teams[currentIndex].file}`;
        currentImage.onload = () => {
            drawImagePixelated(4);
        };
    }

    function drawImagePixelated(pixelSize) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        
        let w = canvas.width / pixelSize;
        let h = canvas.height / pixelSize;
        
        ctx.drawImage(currentImage, 0, 0, w, h);
        ctx.drawImage(canvas, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
    }

    function checkGuess() {
        let userGuess = guessInput.value.toLowerCase().trim();
        let targetName = teams[currentIndex].name.toLowerCase();

        if (userGuess === targetName) {
            score += 10;
            scoreText.textContent = translations[currentLang].score + score;
            message.textContent = translations[currentLang].correctMsg;
            message.className = "message correct";
            currentIndex++;
            setTimeout(loadTeam, 1500);
        } else {
            message.textContent = translations[currentLang].wrongMsg;
            message.className = "message wrong";
        }
    }

    submitBtn.addEventListener('click', checkGuess);
    guessInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkGuess();
    });

    hintBtn.addEventListener('click', () => {
        score = Math.max(0, score - 5);
        scoreText.textContent = translations[currentLang].score + score;
        drawImagePixelated(2);
    });

    // Dil Değiştirme Butonu
    langToggle.addEventListener('click', () => {
        currentLang = currentLang === 'tr' ? 'en' : 'tr';
        updateTexts();
    });

    function updateTexts() {
        let t = translations[currentLang];
        leagueText.textContent = t.league;
        scoreText.textContent = t.score + score;
        guessInput.placeholder = t.placeholder;
        submitBtn.textContent = t.submit;
        hintBtn.textContent = t.hint;
        langToggle.textContent = t.langBtn;
    }

    // Oyunu başlat
    loadTeam();
</script>

</body>
</html>
