<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Footy - Logo Tahmin</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --correct: #22c55e;
            --wrong: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .canvas-wrapper {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: #334155;
            color: #fff;
            flex: 1;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .correct { color: var(--correct); }
        .wrong { color: var(--wrong); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge" id="leagueText">Süper Lig</span>
        <span class="badge" id="scoreText">Puan: 0</span>
    </div>

    <div class="canvas-wrapper">
        <canvas id="pixelCanvas" width="256" height="256"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="guessInput" placeholder="Takım adını yazın..." autocomplete="off">
        <button id="submitBtn">Tahmin Et</button>
    </div>

    <div class="actions">
        <button class="btn-secondary" id="hintBtn">Netleştir (-5)
