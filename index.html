<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelFooty</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            margin-bottom: 8px;
        }

        .lang-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .info-text {
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        canvas {
            image-rendering: pixelated;
            width: 100%;
            max-width: 250px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin: 10px 0;
        }

        .input-row {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 8px;
            font-size: 1rem;
            border: 1px solid #999;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #f8f8f8;
            font-weight: bold;
        }

        button:active {
            background: #e0e0e0;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
        }

        .btn-row button {
            flex: 1;
        }

        .message {
            font-weight: bold;
            margin-top: 10px;
            min-height: 24px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header-top">
            <span id="titleText" style="font-weight: bold;">⚽ PixelFooty</span>
            <button class="lang-btn" id="langToggle">EN 🇬🇧</button>
        </div>
        
        <div class="info-text" id="scoreDisplay">Puan: 0</div>
        <div class="info-text" id="streakDisplay">Seri: 0</div>
        <div class="info-text" id="leagueDisplay">🇹🇷 Süper Lig 🟢 Kolay</div>

        <div>
            <canvas id="pixelCanvas" width="256" height="256"></canvas>
        </div>

        <div class="info-text" id="statusDisplay">Netlik: Aşama 1/4 Ödül: 25 Puan</div>

        <div class="input-row">
            <input type="text" id="guessInput" placeholder="Takım adını yazın..." autocomplete="off">
            <button id="submitBtn" style="background:#e0f2fe; border-color:#bae6fd;">Tahmin Et</button>
        </div>

        <div class="btn-row">
            <button id="hintBtn">💡 Netleştir</button>
            <button id="skipBtn">Pas Geç</button>
        </div>

        <div class="message" id="message"></div>
    </div>

<script>
    const translations = {
        tr: {
            title: "⚽ PixelFooty",
            score: "Puan: ",
            streak: "Seri: ",
            league: "🇹🇷 Süper Lig 🟢 Kolay",
            status: "Netlik: Aşama 1/4 Ödül: 25 Puan",
            placeholder: "Takım adını yazın...",
            submit: "Tahmin Et",
            hint: "💡 Netleştir",
            skip: "Pas Geç",
            correctMsg: "Tebrikler! Doğru bildin 🎉",
            wrongMsg: "Yanlış! Tekrar dene ❌",
            shortNameMsg: "Lütfen kısaltma yazmayın, takımın tam adını girin! ⚠️",
            gameOver: "Tebrikler! Tüm takımları bitirdin!"
        },
        en: {
            title: "⚽ PixelFooty",
            score: "Score: ",
            streak: "Streak: ",
            league: "🇹🇷 Turkish Super League 🟢 Easy",
            status: "Clarity: Stage 1/4 Reward: 25 Pts",
            placeholder: "Enter team name...",
            submit: "Guess",
            hint: "💡 Sharpen",
            skip: "Skip",
            correctMsg: "Correct! Well done 🎉",
            wrongMsg: "Wrong! Try again ❌",
            shortNameMsg: "Please write the full team name, no abbreviations! ⚠️",
            gameOver: "Congrats! You finished all teams!"
        }
    };

    let currentLang = 'tr';

    const teams = [
        { name: "beşiktaş", file: "bjk.png" },
        { name: "fenerbahçe", file: "fb.png" },
        { name: "galatasaray", file: "gs.png" },
        { name: "trabzonspor", file: "ts.png" },
        { name: "başakşehir", file: "başşehir.png" },
        { name: "samsunspor", file: "samsun.png" },
        { name: "göztepe", file: "goztepe.png" },
        { name: "konyaspor", file: "konya.png" },
        { name: "antalyaspor", file: "antalya.png" }
    ];

    let score = 0;
    let streak = 0;
    let currentIndex = 0;
    let currentStage = 1;
    let isAnswered = false;
    
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const guessInput = document.getElementById('guessInput');
    const submitBtn = document.getElementById('submitBtn');
    const hintBtn = document.getElementById('hintBtn');
    const skipBtn = document.getElementById('skipBtn');
    const message = document.getElementById('message');
    
    const titleText = document.getElementById('titleText');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const streakDisplay = document.getElementById('streakDisplay');
    const leagueDisplay = document.getElementById('leagueDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const langToggle = document.getElementById('langToggle');

    let currentImage = new Image();

    function loadTeam() {
        if (currentIndex >= teams.length) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            message.textContent = translations[currentLang].gameOver;
            return;
        }
        
        isAnswered = false;
        message.textContent = "";
        guessInput.value = "";
        currentStage = 1;
        updateStatusText();
        
        // Canvas'ı tamamen temizle (eski logonun kalma sorununu çözer)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        currentImage = new Image(); // Yeni görsel nesnesi oluşturarak cache/takılma sorununu önle
        currentImage.src = `logos/${teams[currentIndex].file}`;
        currentImage.onload = () => {
            drawImagePixelated(12);
        };
    }

    function drawImagePixelated(pixelSize) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        
        if (pixelSize === 1) {
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
            return;
        }

        let w = Math.max(1, Math.floor(canvas.width / pixelSize));
        let h = Math.max(1, Math.floor(canvas.height / pixelSize));
        
        let tempCanvas = document.createElement('canvas');
        let tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = w;
        tempCanvas.height = h;
        
        tempCtx.imageSmoothingEnabled = false;
        tempCtx.drawImage(currentImage, 0, 0, w, h);
        ctx.drawImage(tempCanvas, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
    }

    function updateStatusText() {
        let t = translations[currentLang];
        if (currentLang === 'tr') {
            statusDisplay.textContent = `Netlik: Aşama ${currentStage}/4 Ödül: ${Math.max(5, 25 - (currentStage-1)*5)} Puan`;
        } else {
            statusDisplay.textContent = `Clarity: Stage ${currentStage}/4 Reward: ${Math.max(5, 25 - (currentStage-1)*5)} Pts`;
        }
    }

    function checkGuess() {
        if (isAnswered) return;
        let userGuess = guessInput.value.toLowerCase().trim();
        let targetName = teams[currentIndex].name.toLowerCase();

        const forbiddenShorts = ["gs", "fb", "bjk", "ts", "basak"];
        if (forbiddenShorts.includes(userGuess) || userGuess.length <= 2) {
            message.textContent = translations[currentLang].shortNameMsg;
            return;
        }

        let earnedPoints = Math.max(5, 25 - (currentStage - 1) * 5);

        if (userGuess === targetName) {
            isAnswered = true;
            score += earnedPoints;
            streak += 1;
            scoreDisplay.textContent = translations[currentLang].score + score;
            streakDisplay.textContent = translations[currentLang].streak + streak;
            message.textContent = translations[currentLang].correctMsg;
            
            // Doğru bilince canvas temizlenip net hali çizilir
            drawImagePixelated(1);

            currentIndex++;
            setTimeout(loadTeam, 2000);
        } else {
            message.textContent = translations[currentLang].wrongMsg;
        }
    }

    submitBtn.addEventListener('click', checkGuess);
    guessInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkGuess();
    });

    hintBtn.addEventListener('click', () => {
        if (!isAnswered && currentStage < 4) {
            currentStage++;
            let pSize = 12 - (currentStage * 2);
            drawImagePixelated(Math.max(3, pSize));
            updateStatusText();
        }
    });

    skipBtn.addEventListener('click', () => {
        if (isAnswered) return;
        streak = 0; // Pas geçince seri sıfırlanır (orijinal kural)
        streakDisplay.textContent = translations[currentLang].streak + streak;
        currentIndex++;
        loadTeam();
    });

    langToggle.addEventListener('click', () => {
        currentLang = currentLang === 'tr' ? 'en' : 'tr';
        updateTexts();
    });

    function updateTexts() {
        let t = translations[currentLang];
        titleText.textContent = t.title;
        scoreDisplay.textContent = t.score + score;
        streakDisplay.textContent = t.streak + streak;
        leagueDisplay.textContent = t.league;
        guessInput.placeholder = t.placeholder;
        submitBtn.textContent = t.submit;
        hintBtn.textContent = t.hint;
        skipBtn.textContent = t.skip;
        langToggle.textContent = currentLang === 'tr' ? "EN 🇬🇧" : "TR 🇹🇷";
        updateStatusText();
    }

    loadTeam();
</script>

</body>
</html>
